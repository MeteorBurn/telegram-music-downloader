<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Music Downloader</title>
    <meta name="description" content="Local control panel for downloading lossless audio from Telegram channels.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#060806">
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <script src="/static/js/theme-init.js"></script>
    <link rel="preload" href="/static/fonts/mona-sans-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/martian-mono-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/shell.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/views.css">
    <link rel="modulepreload" href="/static/js/dom.js">
    <link rel="modulepreload" href="/static/js/api.js">
    <link rel="modulepreload" href="/static/js/store.js">
    <link rel="modulepreload" href="/static/js/format.js">
    <link rel="modulepreload" href="/static/js/ui.js">
    <script type="module" src="/static/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="#/dashboard" aria-label="Music Downloader, dashboard">
          <span class="brand-mark" aria-hidden="true">
            <svg class="icon"><use href="/static/img/icons.svg#i-waveform-bold"></use></svg>
          </span>
          <span class="brand-text">
            <span class="brand-name">Music Downloader</span>
            <span class="brand-sub">for Telegram</span>
          </span>
        </a>

        <nav class="nav" aria-label="Views">
          <a class="nav-item" href="#/dashboard" data-route="dashboard">
            <svg class="icon icon-rest" aria-hidden="true"><use href="/static/img/icons.svg#i-waveform"></use></svg>
            <svg class="icon icon-on" aria-hidden="true"><use href="/static/img/icons.svg#i-waveform-bold"></use></svg>
            <span class="nav-label">Dashboard</span>
            <span class="eq nav-live" data-live aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </a>
          <a class="nav-item" href="#/library" data-route="library">
            <svg class="icon icon-rest" aria-hidden="true"><use href="/static/img/icons.svg#i-vinyl-record"></use></svg>
            <svg class="icon icon-on" aria-hidden="true"><use href="/static/img/icons.svg#i-vinyl-record-fill"></use></svg>
            <span class="nav-label">Library</span>
          </a>
          <a class="nav-item" href="#/logs" data-route="logs">
            <svg class="icon icon-rest" aria-hidden="true"><use href="/static/img/icons.svg#i-terminal-window"></use></svg>
            <svg class="icon icon-on" aria-hidden="true"><use href="/static/img/icons.svg#i-terminal-window-fill"></use></svg>
            <span class="nav-label">Logs</span>
          </a>
          <a class="nav-item" href="#/settings" data-route="settings">
            <svg class="icon icon-rest" aria-hidden="true"><use href="/static/img/icons.svg#i-sliders-horizontal"></use></svg>
            <svg class="icon icon-on" aria-hidden="true"><use href="/static/img/icons.svg#i-sliders-horizontal-fill"></use></svg>
            <span class="nav-label">Settings</span>
          </a>
          <a class="nav-item" href="#/account" data-route="account">
            <svg class="icon icon-rest" aria-hidden="true"><use href="/static/img/icons.svg#i-user-circle"></use></svg>
            <svg class="icon icon-on" aria-hidden="true"><use href="/static/img/icons.svg#i-user-circle-fill"></use></svg>
            <span class="nav-label">Account</span>
          </a>
        </nav>

        <div class="sidebar-foot">
          <div class="server" id="server" data-online="true" role="status">
            <svg class="icon" aria-hidden="true"><use href="/static/img/icons.svg#i-plugs-connected"></use></svg>
            <span class="server-text">
              <span class="server-host mono" id="server-host">127.0.0.1</span>
              <span class="server-state" id="server-state">Local server online</span>
            </span>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-title">
            <span class="brand-mark" aria-hidden="true">
              <svg class="icon"><use href="/static/img/icons.svg#i-waveform-bold"></use></svg>
            </span>
            <h1 id="view-title">Dashboard</h1>
          </div>
          <div class="topbar-status" id="topbar-status"></div>
        </header>

        <main class="view" id="view" tabindex="-1"></main>

        <div class="dock" id="dock" hidden></div>
      </div>

      <nav class="tabbar" aria-label="Views">
        <a class="tab" href="#/dashboard" data-route="dashboard">
          <svg class="icon icon-rest" aria-hidden="true"><use href="/static/img/icons.svg#i-waveform"></use></svg>
          <svg class="icon icon-on" aria-hidden="true"><use href="/static/img/icons.svg#i-waveform-bold"></use></svg>
          <span>Dashboard</span>
        </a>
        <a class="tab" href="#/library" data-route="library">
          <svg class="icon icon-rest" aria-hidden="true"><use href="/static/img/icons.svg#i-vinyl-record"></use></svg>
          <svg class="icon icon-on" aria-hidden="true"><use href="/static/img/icons.svg#i-vinyl-record-fill"></use></svg>
          <span>Library</span>
        </a>
        <a class="tab" href="#/logs" data-route="logs">
          <svg class="icon icon-rest" aria-hidden="true"><use href="/static/img/icons.svg#i-terminal-window"></use></svg>
          <svg class="icon icon-on" aria-hidden="true"><use href="/static/img/icons.svg#i-terminal-window-fill"></use></svg>
          <span>Logs</span>
        </a>
        <a class="tab" href="#/settings" data-route="settings">
          <svg class="icon icon-rest" aria-hidden="true"><use href="/static/img/icons.svg#i-sliders-horizontal"></use></svg>
          <svg class="icon icon-on" aria-hidden="true"><use href="/static/img/icons.svg#i-sliders-horizontal-fill"></use></svg>
          <span>Settings</span>
        </a>
        <a class="tab" href="#/account" data-route="account">
          <svg class="icon icon-rest" aria-hidden="true"><use href="/static/img/icons.svg#i-user-circle"></use></svg>
          <svg class="icon icon-on" aria-hidden="true"><use href="/static/img/icons.svg#i-user-circle-fill"></use></svg>
          <span>Account</span>
        </a>
      </nav>
    </div>

    <div class="toasts" id="toasts" role="region" aria-label="Notifications"></div>
    <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>

    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">Music Downloader needs JavaScript to run.</p>
    </noscript>
  </body>
</html>
